<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나를 부르는 목소리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#b6cfc1;color:#fff9e5;font:16px "Malgun Gothic",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header,footer{position:fixed;pointer-events:none;text-shadow:0 2px 5px #251a10}header{top:0;left:0;width:100%;padding:25px 4vw 40px;background:linear-gradient(#1b342595,transparent)}small{letter-spacing:.15em}h1{font:600 clamp(22px,3vw,36px) serif;margin:5px 0}footer{bottom:0;width:100%;background:linear-gradient(transparent,#1a221deb);padding:42px 4vw 20px}#hint{font-weight:700;font-size:20px}#keys{font-size:13px;opacity:.85;margin-top:8px}button{cursor:pointer;background:#fff4d9;color:#2c4136;border:0;border-radius:6px;padding:9px 14px;font:inherit}#menu{position:fixed;right:4vw;top:25px}dialog{max-width:440px;padding:28px;border:0;border-radius:12px;background:#fff8e7;color:#294137}dialog::backdrop{background:#16251bc0}dialog p{line-height:1.65}label{display:block;margin:12px 0}
.parable canvas{filter:sepia(.32) contrast(1.08)}.parable:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 8vw #6e4a1e88;background:repeating-linear-gradient(8deg,transparent 0 4px,#64472809 5px 6px);z-index:0}header,footer,#subtitles,#menu{z-index:1}dialog{max-height:85vh;overflow:auto}#lastPanel{position:fixed;top:26%;left:5vw;background:#21392ee8;color:#fff5d9;border-left:3px solid #cbb17f;padding:20px 26px;max-width:min(400px,82vw);pointer-events:none}#lastPanel h2{font:600 27px serif;margin:10px 0}#lastPanel p{line-height:1.55}#lastPanel p:last-child{font-size:13px;color:#daceb7}#book{width:min(460px,92vw)}#book button:focus-visible,#chapterList:focus-visible{outline:3px solid #a36525;outline-offset:2px}.book-actions{display:flex;gap:8px;margin-bottom:14px}#chooseChapter,#leaveReplay,#chapterContents button{background:#315946;color:#fff8e8}#chapterLibrary{border-block:1px solid #d3ccaf;padding:4px 0 10px;margin-bottom:12px}#chapterList{font:inherit;width:100%;padding:8px;color:#294137;background:#fffdf4;border:1px solid #a7ad94;border-radius:5px}#chapterContents{display:grid;gap:8px;padding-top:12px}#chapterContents h3{font-size:16px;margin:8px 0 0}.scene-option{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}.scene-option span,.book-note{font-size:13px}.book-note{margin-bottom:0}#journalMainActions{display:flex;flex-wrap:wrap;gap:6px}
:root{--subtitle-bottom:max(23vh,94px);--subtitle-space:calc(100dvh - var(--subtitle-bottom) - 90px)}#subtitles{position:fixed;bottom:var(--subtitle-bottom);inset-inline:3vw;display:grid;justify-items:center;gap:4px;pointer-events:none;font-size:var(--caption-size,16px);line-height:1.45;text-align:center}
#caption,#directionCue,#captionSample{width:fit-content;max-width:min(100%,52rem);padding:.32em .85em;background:#172c25f5;color:#fff9e8;border-radius:.65em;overflow-wrap:anywhere}
#caption{max-height:var(--subtitle-space);overflow-y:auto;overscroll-behavior:contain}#subtitles:has(#directionCue:not(:empty)) #caption{max-height:calc(var(--subtitle-space) - 4.2em)}#caption[tabindex]{pointer-events:auto;touch-action:pan-y}#caption:focus-visible{outline:3px solid #ffdea3}#caption:empty,#directionCue:empty{display:none}#directionCue{background:#fff5ddf5;color:#284234}
#accessButton{background:#315946;color:#fff8e8}.book-actions{flex-wrap:wrap}#accessPanel{margin-block:14px}#accessPanel fieldset{border:0;margin:0 0 14px;padding:0}#accessPanel legend{font-weight:bold;border-bottom:1px solid #d3ccaf;width:100%;padding:4px 0}
#accessPanel .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}#accessPanel select{font:inherit;padding:5px 8px;border:1px solid #a7ad94;border-radius:5px;background:#fffdf4;color:#294137}
#accessPanel input[type=range]{width:100%;margin:0;accent-color:#315946}#accessPanel input[type=checkbox]{accent-color:#315946}#accessPanel input:focus-visible,#accessPanel select:focus-visible{outline:3px solid #a36525;outline-offset:2px}#accessPanel output{font-variant-numeric:tabular-nums}.sound-sample{font-size:14px;padding:5px 9px;border:1px solid #a7ad94}.sound-sample:disabled{color:#766f61;cursor:default}
#captionSample{font-size:var(--caption-size,16px);line-height:1.45;margin:6px 0 12px}#book[data-section=access] #restart,#book[data-section=access] #nativityReplay{display:none}
@media(max-height:480px){:root{--subtitle-bottom:78px;--subtitle-space:calc(100dvh - 160px)}header{padding-block:10px}footer{padding-block:20px 8px}}
</style>
<header><small>갈릴리 · 제1장</small><h1>나를 부르는 목소리</h1><span id="place"></span></header><button id="menu">여행 수첩</button><div id="subtitles"><aside id="caption" role="status"></aside><aside id="directionCue" role="status"></aside></div><footer><div id="hint"></div><div id="keys">WASD 이동　Shift 달리기　드래그 / ← → 둘러보기　우클릭 / Q 귀 쫑긋　E 행동</div></footer>
<dialog id="book"><h2>여행 수첩</h2><div class="book-actions"><button id="chooseChapter" aria-controls="chapterLibrary" aria-expanded="false">장 선택</button><button id="accessButton" aria-controls="accessPanel" aria-expanded="false">접근성 설정</button><button id="leaveReplay" hidden>원래 여정으로 돌아가기</button></div>
<section id="chapterLibrary" hidden aria-label="장 선택"><label for="chapterList">다시 걸을 장</label><select id="chapterList"></select><div id="chapterContents"></div><p class="book-note">다시 플레이한 선택은 이 탭에만 저장됩니다. 수첩에서 원래 체크포인트로 돌아갈 수 있어요.</p></section>
<section id="accessPanel" aria-label="접근성 설정" hidden>
<fieldset><legend>자막과 조작</legend>
<label class="setting-row">자막 크기 <select id="captionSize"><option value="16">기본</option><option value="20">크게</option><option value="24">더 크게</option><option value="28">가장 크게</option></select></label>
<p id="captionSample" aria-label="자막 미리보기">물방울 소리가 들린다.</p>
<label><input type="checkbox" id="directionCaptions"> 귀 기울일 때 소리의 방향과 이름 표시</label>
<label><input type="checkbox" id="toggle"> 귀 쫑긋을 눌러 전환</label>
<label class="setting-row">카메라 흔들림 <select id="cameraShake"><option value="100">기본</option><option value="35">줄이기</option><option value="0">끄기</option></select></label>
</fieldset>
<fieldset><legend>소리</legend>
<label><input type="checkbox" id="mute"> 전체 음소거</label>
<label class="setting-row" for="voiceVolume">목소리 <output for="voiceVolume" id="voiceLevel"></output></label>
<input type="range" id="voiceVolume" min="0" max="100" step="1"><button type="button" class="sound-sample" id="sampleVoice">목소리 듣기</button>
<label class="setting-row" for="ambientVolume">환경음 <output for="ambientVolume" id="ambientLevel"></output></label>
<input type="range" id="ambientVolume" min="0" max="100" step="1"><button type="button" class="sound-sample" id="sampleAmbient">환경음 듣기</button>
</fieldset></section>
<article id="memory"></article><div id="journalMainActions"><button id="nativityReplay" hidden>탄생 서막 다시 보기</button><button id="resume">돌아가기</button> <button id="restart">처음부터</button></div></dialog>
